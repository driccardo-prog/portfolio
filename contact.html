<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Dolores Riccardo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="contact-page">
    <!-- ========== HEADER ========== -->
    <header class="header">
        <a href="./index.html" class="logo">Dolores R</a>
        <nav class="nav-center">
            <a href="./index.html" class="nav-link">Home</a>,&nbsp;<a href="./work.html" class="nav-link">Work</a>,&nbsp;<a href="./about.html" class="nav-link">About</a>,&nbsp;<a href="./cv.html" class="nav-link">CV</a>
        </nav>
        <div class="header-right">
            <span class="header-location">Bs As &amp; Worldwide</span>
            <a href="./contact.html" class="nav-link">Let's get in touch ;)</a>
        </div>
    </header>

    <!-- ========== CONTACT ========== -->
    <section class="contact-block contact-block--compact">
        <div class="contact-block-main">
            <h1 class="contact-headline flip-headline">
                <span class="flip-card">
                    <span class="flip-face flip-front"><span class="flip-line">BsAs</span><span class="flip-line">&amp; Worldwide.</span></span>
                    <span class="flip-face flip-back"><span class="flip-line">Let's talk about</span><span class="flip-line">your next project <span class="flip-arrow" aria-hidden="true">↓</span></span></span>
                </span>
            </h1>
            <div class="contact-socials">
                <a href="https://www.instagram.com/loliriccardo/" target="_blank" rel="noopener noreferrer">Instagram</a>
                &nbsp;&amp;&nbsp;
                <a href="https://www.linkedin.com/in/dolores-riccardo-86709313b/?locale=es" target="_blank" rel="noopener noreferrer">Linkedin</a>
            </div>
        </div>
    </section>

    <!-- ========== CONTACT FORM ========== -->
    <section class="quote-section" id="quote">
        <h2 class="quote-headline" data-typewriter="Let's talk&#10;about your idea?"><span class="type-caret"></span></h2>
        <form class="quote-form" action="https://formsubmit.co/d.riccardo@icloud.com" method="POST">
            <input type="hidden" name="_subject" value="New inquiry from the portfolio">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">

            <div class="quote-form-grid">
                <label class="quote-field">
                    <span class="quote-label">Name*</span>
                    <input type="text" name="name" placeholder="Camila Vázquez" required>
                </label>
                <label class="quote-field">
                    <span class="quote-label">Email*</span>
                    <input type="email" name="email" placeholder="camila@gmail.com" required>
                </label>

                <label class="quote-field">
                    <span class="quote-label">Phone*</span>
                    <input type="tel" name="phone" placeholder="+54…" required>
                </label>
                <label class="quote-field">
                    <span class="quote-label">Country*</span>
                    <input type="text" name="country" placeholder="Argentina" required>
                </label>

                <label class="quote-field">
                    <span class="quote-label">How did you find me?*</span>
                    <select name="source" required>
                        <option value="" disabled selected>Pick one</option>
                        <option>Instagram</option>
                        <option>LinkedIn</option>
                        <option>Referral</option>
                        <option>Google Search</option>
                        <option>Other</option>
                    </select>
                </label>
                <label class="quote-field">
                    <span class="quote-label">Budget*</span>
                    <select name="budget" required>
                        <option value="" disabled selected>Pick one</option>
                        <option>Less than USD 1,500</option>
                        <option>USD 2,000 – 3,500</option>
                        <option>Not sure</option>
                    </select>
                </label>

                <label class="quote-field quote-field--full">
                    <span class="quote-label">What's your project about?*</span>
                    <textarea name="project" rows="4" placeholder="Tell me what your project is about…" required></textarea>
                </label>
            </div>

            <div class="quote-form-foot">
                <p class="quote-tagline">Let's make your project grow.</p>
                <button type="submit" class="quote-submit">Send</button>
            </div>
        </form>
    </section>

    <aside class="contact-info contact-info--below">
        <div class="contact-item">
            <span class="contact-label">PHONE</span>
            <a class="contact-value" href="https://wa.me/5491141773952" target="_blank" rel="noopener noreferrer">+54 9 11 4177 3952</a>
        </div>
        <div class="contact-item">
            <span class="contact-label">MAIL</span>
            <a class="contact-value" href="mailto:d.riccardo@icloud.com">d.riccardo@icloud.com</a>
        </div>
        <div class="contact-item">
            <span class="contact-label">LOCATION</span>
            <span class="contact-value">Buenos Aires &amp; Worldwide</span>
        </div>
    </aside>

    <script src="./js/contact.js" defer></script>

    <footer class="contact-footer">
        <a href="./index.html" class="footer-nav-link">Home</a>
        <a href="./work.html" class="footer-nav-link">Work</a>
        <a href="mailto:d.riccardo@icloud.com" class="footer-nav-link">Contact</a>
    </footer>
</body>
</html>
