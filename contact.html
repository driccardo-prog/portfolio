<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Dolores Riccardo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="contact-page">
    <!-- ========== HEADER ========== -->
    <header class="header">
        <a href="./index.html" class="logo">Lolô</a>
        <nav class="nav-center">
            <a href="./work.html" class="nav-link">About, Work</a>
        </nav>
        <div class="header-right">
            <span class="header-location">Bs As &amp; Worldwide</span>
            <a href="./contact.html" class="nav-link">Let's get in touch ;)</a>
        </div>
    </header>

    <!-- ========== CONTACT ========== -->
    <section class="contact-block">
        <div class="contact-block-main">
            <h1 class="contact-headline flip-headline">
                <span class="flip-card">
                    <span class="flip-face flip-front"><span class="flip-line">BsAs</span><span class="flip-line">&amp; Worldwide.</span></span>
                    <span class="flip-face flip-back"><span class="flip-line">Let's talk about</span><span class="flip-line">your next project <span class="flip-arrow" aria-hidden="true">↓</span></span></span>
                </span>
            </h1>
            <div class="contact-socials">
                <a href="https://www.instagram.com/loliriccardo/" target="_blank" rel="noopener noreferrer">Instagram</a>
                &nbsp;&amp;&nbsp;
                <a href="https://www.linkedin.com/in/dolores-riccardo-86709313b/?locale=es" target="_blank" rel="noopener noreferrer">Linkedin</a>
            </div>
        </div>
        <aside class="contact-info">
            <div class="contact-item">
                <span class="contact-label">PHONE</span>
                <span class="contact-value">+54 9 11 4177 3952</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">MAIL</span>
                <span class="contact-value">d.riccardo@icloud.com</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">LOCATION</span>
                <span class="contact-value">Buenos Aires &amp; Worldwide</span>
            </div>
        </aside>
    </section>

    <!-- ========== CONTACT FORM ========== -->
    <section class="quote-section" id="quote">
        <h2 class="quote-headline" data-typewriter="¿Hablamos&#10;de tu idea?"><span class="type-caret"></span></h2>
        <form class="quote-form" action="https://formsubmit.co/d.riccardo@icloud.com" method="POST">
            <input type="hidden" name="_subject" value="Nueva consulta desde el portfolio">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">

            <div class="quote-form-grid">
                <label class="quote-field">
                    <span class="quote-label">Nombre*</span>
                    <input type="text" name="nombre" placeholder="Antonio Pérez" required>
                </label>
                <label class="quote-field">
                    <span class="quote-label">Correo*</span>
                    <input type="email" name="correo" placeholder="antonio@gmail.com" required>
                </label>

                <label class="quote-field">
                    <span class="quote-label">Teléfono*</span>
                    <input type="tel" name="telefono" placeholder="+54…" required>
                </label>
                <label class="quote-field">
                    <span class="quote-label">País*</span>
                    <input type="text" name="pais" placeholder="Argentina" required>
                </label>

                <label class="quote-field">
                    <span class="quote-label">¿Cómo me conociste?*</span>
                    <select name="origen" required>
                        <option value="" disabled selected>Elegí una opción</option>
                        <option>Instagram</option>
                        <option>LinkedIn</option>
                        <option>Referencia</option>
                        <option>Búsqueda en Google</option>
                        <option>Otro</option>
                    </select>
                </label>
                <label class="quote-field">
                    <span class="quote-label">Presupuesto*</span>
                    <select name="presupuesto" required>
                        <option value="" disabled selected>Elegí una opción</option>
                        <option>Menos de USD 1.500</option>
                        <option>USD 2.000 – 3.500</option>
                        <option>No lo sé</option>
                    </select>
                </label>

                <label class="quote-field quote-field--full">
                    <span class="quote-label">¿De qué va tu proyecto?*</span>
                    <textarea name="proyecto" rows="4" placeholder="Contame de qué va tu proyecto…" required></textarea>
                </label>
            </div>

            <div class="quote-form-foot">
                <p class="quote-tagline">Hagamos que tu proyecto crezca.</p>
                <button type="submit" class="quote-submit">Enviar</button>
            </div>
        </form>
    </section>

    <script src="./js/contact.js" defer></script>

    <footer class="contact-footer">
        <a href="./index.html" class="footer-nav-link">Home</a>
        <a href="./work.html" class="footer-nav-link">Work</a>
        <a href="mailto:d.riccardo@icloud.com" class="footer-nav-link">Contact</a>
    </footer>
</body>
</html>
